name: CD Go Multi-Cloud Manual

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  # Azure
  RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
  AKS_NAME: ${{ vars.AKS_NAME }}
  REGISTRY_NAME: ${{ vars.REGISTRY_NAME }}
  CONTAINER_NAME_GO: ${{ vars.CONTAINER_NAME }}-go

  # AWS
  AWS_REGION: ${{ vars.AWS_REGION }}
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
  ECR_REPOSITORY_NAME: ${{ vars.ECR_REPOSITORY_NAME }}-go

  # App/K8s
  NAMESPACE: default
  APP_DEPLOYMENT_NAME: ed-team-app-go

  # Temporary image in GHCR
  GHCR_IMAGE_NAME: ed-team-app-go-multicloud

jobs:
  build_once:
    name: Build Once (GHCR temp)
    runs-on: ubuntu-latest
    outputs:
      short-sha: ${{ steps.sha.outputs.short_sha }}
      ghcr-owner-lc: ${{ steps.owner.outputs.owner_lc }}
      ghcr-tag: ${{ steps.meta.outputs.tag }}
      ghcr-image: ${{ steps.meta.outputs.image }}
      ghcr-digest: ${{ steps.build_push.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: src-go/go.mod

      - name: Run tests
        working-directory: src-go
        run: go test -v -race ./...

      - name: Short SHA
        id: sha
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Compute GHCR metadata
        id: owner
        run: echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build metadata
        id: meta
        run: |
          TAG="mc-${{ github.run_id }}-${{ steps.sha.outputs.short_sha }}"
          IMAGE="ghcr.io/${{ steps.owner.outputs.owner_lc }}/${{ env.GHCR_IMAGE_NAME }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push temporary image to GHCR
        id: build_push
        uses: docker/build-push-action@v6
        with:
          context: ./src-go
          file: ./src-go/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          provenance: false

  promote_azure:
    name: Promote Image to ACR
    runs-on: ubuntu-latest
    needs: build_once
    outputs:
      azure-image: ${{ steps.push.outputs.azure_image }}

    steps:
      - name: Azure Login
        uses: Azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to ACR
        run: az acr login --name "${{ env.REGISTRY_NAME }}"

      - name: Pull from GHCR and push to ACR
        id: push
        run: |
          SOURCE_IMAGE="${{ needs.build_once.outputs.ghcr-image }}@${{ needs.build_once.outputs.ghcr-digest }}"
          TARGET_IMAGE="${{ env.REGISTRY_NAME }}.azurecr.io/${{ env.CONTAINER_NAME_GO }}:${{ needs.build_once.outputs.short-sha }}"

          docker pull "$SOURCE_IMAGE"
          docker tag "$SOURCE_IMAGE" "$TARGET_IMAGE"
          docker push "$TARGET_IMAGE"

          echo "azure_image=$TARGET_IMAGE" >> "$GITHUB_OUTPUT"

  promote_aws:
    name: Promote Image to ECR
    runs-on: ubuntu-latest
    needs: build_once
    outputs:
      aws-image: ${{ steps.push.outputs.aws_image }}

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "${{ env.ECR_REPOSITORY_NAME }}" --region "${{ env.AWS_REGION }}" 2>/dev/null || \
          aws ecr create-repository --repository-name "${{ env.ECR_REPOSITORY_NAME }}" --region "${{ env.AWS_REGION }}"

      - name: Pull from GHCR and push to ECR
        id: push
        run: |
          AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
          SOURCE_IMAGE="${{ needs.build_once.outputs.ghcr-image }}@${{ needs.build_once.outputs.ghcr-digest }}"
          TARGET_IMAGE="${ECR_REGISTRY}/${{ env.ECR_REPOSITORY_NAME }}:${{ needs.build_once.outputs.short-sha }}"

          docker pull "$SOURCE_IMAGE"
          docker tag "$SOURCE_IMAGE" "$TARGET_IMAGE"
          docker push "$TARGET_IMAGE"

          echo "aws_image=$TARGET_IMAGE" >> "$GITHUB_OUTPUT"

  release:
    name: Create Release Tag
    runs-on: ubuntu-latest
    needs: build_once
    outputs:
      release-tag: ${{ steps.create_release.outputs.tag_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release tag
        id: tag_version
        run: |
          TAG="go-mc-v$(date +'%Y%m%d')-${{ needs.build_once.outputs.short-sha }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1.1.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag_version.outputs.tag }}
          release_name: "Release Go MultiCloud ${{ steps.tag_version.outputs.tag }}"
          body: |
            ## Multi-Cloud Go Deployment

            - Release: `${{ steps.tag_version.outputs.tag }}`
            - GHCR temp image: `${{ needs.build_once.outputs.ghcr-image }}:${{ needs.build_once.outputs.ghcr-tag }}`
            - Digest: `${{ needs.build_once.outputs.ghcr-digest }}`
            - Commit: `${{ github.sha }}`
            - Triggered by: `${{ github.actor }}`
          draft: false
          prerelease: false

  deploy_azure:
    name: Deploy Go in AKS
    runs-on: ubuntu-latest
    needs: [promote_azure, release]
    outputs:
      external_addr: ${{ steps.access.outputs.external_addr }}
      app_url: ${{ steps.access.outputs.app_url }}
      health_url: ${{ steps.access.outputs.health_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: Azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS context
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ env.RESOURCE_GROUP }}
          cluster-name: ${{ env.AKS_NAME }}
          admin: "false"

      - name: Configure ACR pull secret
        run: |
          ACR_USERNAME=$(az acr credential show --name "${{ env.REGISTRY_NAME }}" --resource-group "${{ env.RESOURCE_GROUP }}" --query username -o tsv)
          ACR_PASSWORD=$(az acr credential show --name "${{ env.REGISTRY_NAME }}" --resource-group "${{ env.RESOURCE_GROUP }}" --query passwords[0].value -o tsv)

          kubectl create secret docker-registry registry-secret \
            --namespace="${{ env.NAMESPACE }}" \
            --docker-server="${{ env.REGISTRY_NAME }}.azurecr.io" \
            --docker-username="$ACR_USERNAME" \
            --docker-password="$ACR_PASSWORD" \
            --docker-email=noreply@example.com \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy manifests and set image
        run: |
          kubectl apply -f k8s-go/middleware.yml
          kubectl apply -f k8s-go/service.yml
          kubectl apply -f k8s-go/deployment.yml
          kubectl set image -n "${{ env.NAMESPACE }}" deployment/${{ env.APP_DEPLOYMENT_NAME }} ${{ env.APP_DEPLOYMENT_NAME }}="${{ needs.promote_azure.outputs.azure-image }}"
          kubectl rollout status -n "${{ env.NAMESPACE }}" deployment/${{ env.APP_DEPLOYMENT_NAME }} --timeout=600s
          kubectl apply -f k8s-go/hpa.yml
          kubectl apply -f k8s-go/ingress.yml

      - name: Get external access info
        id: access
        run: |
          EXTERNAL_ADDR=$(kubectl get service -n traefik traefik -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || echo "")
          if [ -z "$EXTERNAL_ADDR" ]; then
            EXTERNAL_ADDR=$(kubectl get service -n traefik traefik -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "pending")
          fi

          if [ "$EXTERNAL_ADDR" != "pending" ] && [ -n "$EXTERNAL_ADDR" ]; then
            echo "external_addr=$EXTERNAL_ADDR" >> "$GITHUB_OUTPUT"
            echo "app_url=http://$EXTERNAL_ADDR/go" >> "$GITHUB_OUTPUT"
            echo "health_url=http://$EXTERNAL_ADDR/go/health" >> "$GITHUB_OUTPUT"
          else
            echo "external_addr=pending" >> "$GITHUB_OUTPUT"
            echo "app_url=pending" >> "$GITHUB_OUTPUT"
            echo "health_url=pending" >> "$GITHUB_OUTPUT"
          fi

  deploy_aws:
    name: Deploy Go in EKS
    runs-on: ubuntu-latest
    needs: [promote_aws, release]
    outputs:
      external_addr: ${{ steps.access.outputs.external_addr }}
      app_url: ${{ steps.access.outputs.app_url }}
      health_url: ${{ steps.access.outputs.health_url }}
      external_status: ${{ steps.access.outputs.external_status }}
      external_note: ${{ steps.access.outputs.external_note }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set EKS context
        run: |
          aws eks update-kubeconfig \
            --name "${{ env.EKS_CLUSTER_NAME }}" \
            --region "${{ env.AWS_REGION }}"

      - name: Configure ECR pull secret
        run: |
          ECR_PASSWORD=$(aws ecr get-login-password --region "${{ env.AWS_REGION }}")
          AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ECR_SERVER="${AWS_ACCOUNT_ID}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"

          kubectl create secret docker-registry registry-secret \
            --namespace="${{ env.NAMESPACE }}" \
            --docker-server="$ECR_SERVER" \
            --docker-username=AWS \
            --docker-password="$ECR_PASSWORD" \
            --docker-email=noreply@example.com \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy manifests and set image
        run: |
          kubectl apply -f k8s-go/middleware.yml
          kubectl apply -f k8s-go/service.yml
          kubectl apply -f k8s-go/deployment.yml
          kubectl set image -n "${{ env.NAMESPACE }}" deployment/${{ env.APP_DEPLOYMENT_NAME }} ${{ env.APP_DEPLOYMENT_NAME }}="${{ needs.promote_aws.outputs.aws-image }}"
          kubectl rollout status -n "${{ env.NAMESPACE }}" deployment/${{ env.APP_DEPLOYMENT_NAME }} --timeout=600s
          kubectl apply -f k8s-go/hpa.yml
          kubectl apply -f k8s-go/ingress.yml

      - name: Get external access info
        id: access
        run: |
          EXTERNAL_ADDR=""
          EXTERNAL_STATUS="pending"
          EXTERNAL_NOTE="LoadBalancer hostname/ip still pending"

          for i in $(seq 1 30); do
            CANDIDATE=$(kubectl get service -n traefik traefik -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null)
            if [ -z "$CANDIDATE" ]; then
              CANDIDATE=$(kubectl get service -n traefik traefik -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null)
            fi

            if [ -n "$CANDIDATE" ]; then
              EXTERNAL_ADDR="$CANDIDATE"

              # If AWS gives hostname, ensure DNS is resolvable before publishing.
              if echo "$EXTERNAL_ADDR" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'; then
                DNS_OK=1
              else
                getent hosts "$EXTERNAL_ADDR" >/dev/null 2>&1
                DNS_OK=$?
              fi

              if [ "$DNS_OK" -eq 0 ]; then
                CODE=$(curl -sS -m 8 -o /dev/null -w "%{http_code}" "http://$EXTERNAL_ADDR/go/health" || echo "000")
                if [ "$CODE" = "200" ]; then
                  EXTERNAL_STATUS="ready"
                  EXTERNAL_NOTE="DNS and HTTP health check OK"
                  break
                else
                  EXTERNAL_STATUS="dns-ok-http-pending"
                  EXTERNAL_NOTE="DNS resolved but /go/health returned HTTP $CODE"
                fi
              else
                EXTERNAL_STATUS="dns-pending"
                EXTERNAL_NOTE="Hostname allocated but DNS not propagated yet"
              fi
            fi

            sleep 10
          done

          if [ -n "$EXTERNAL_ADDR" ]; then
            echo "external_addr=$EXTERNAL_ADDR" >> "$GITHUB_OUTPUT"
            echo "app_url=http://$EXTERNAL_ADDR/go" >> "$GITHUB_OUTPUT"
            echo "health_url=http://$EXTERNAL_ADDR/go/health" >> "$GITHUB_OUTPUT"
          else
            echo "external_addr=pending" >> "$GITHUB_OUTPUT"
            echo "app_url=pending" >> "$GITHUB_OUTPUT"
            echo "health_url=pending" >> "$GITHUB_OUTPUT"
          fi

          echo "external_status=$EXTERNAL_STATUS" >> "$GITHUB_OUTPUT"
          echo "external_note=$EXTERNAL_NOTE" >> "$GITHUB_OUTPUT"

  cleanup_ghcr:
    name: Cleanup GHCR Temp Image
    runs-on: ubuntu-latest
    needs: [build_once, promote_azure, promote_aws, release, deploy_azure, deploy_aws]
    if: always()
    permissions:
      contents: read
      packages: write
    outputs:
      cleanup-status: ${{ steps.cleanup.outputs.cleanup_status }}
      cleanup-note: ${{ steps.cleanup.outputs.cleanup_note }}

    steps:
      - name: Delete temporary GHCR image tag
        id: cleanup
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE_NAME: ${{ env.GHCR_IMAGE_NAME }}
          TARGET_TAG: ${{ needs.build_once.outputs.ghcr-tag }}
        run: |
          set +e
          API="https://api.github.com"

          TYPE=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$API/users/$OWNER" | jq -r '.type // ""')
          if [ "$TYPE" = "Organization" ]; then
            SCOPE="orgs/$OWNER"
          else
            SCOPE="users/$OWNER"
          fi

          VERSIONS_JSON=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$API/$SCOPE/packages/container/$PACKAGE_NAME/versions?per_page=100")
          VERSION_ID=$(echo "$VERSIONS_JSON" | jq -r --arg TAG "$TARGET_TAG" '.[] | select(any(.metadata.container.tags[]?; . == $TAG)) | .id' | head -n1)

          if [ -z "$VERSION_ID" ] || [ "$VERSION_ID" = "null" ]; then
            echo "cleanup_status=not-found" >> "$GITHUB_OUTPUT"
            echo "cleanup_note=No se encontro el tag temporal en GHCR (posiblemente ya fue eliminado)." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          HTTP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" -X DELETE \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$API/$SCOPE/packages/container/$PACKAGE_NAME/versions/$VERSION_ID")

          if [ "$HTTP_CODE" = "204" ]; then
            echo "cleanup_status=deleted" >> "$GITHUB_OUTPUT"
            echo "cleanup_note=Tag temporal eliminado en GHCR." >> "$GITHUB_OUTPUT"
          else
            echo "cleanup_status=failed" >> "$GITHUB_OUTPUT"
            echo "cleanup_note=No se pudo eliminar en GHCR (HTTP $HTTP_CODE)." >> "$GITHUB_OUTPUT"
          fi

  final_summary:
    name: Final Multi-Cloud Summary
    runs-on: ubuntu-latest
    if: always()
    needs: [
      build_once,
      promote_azure,
      promote_aws,
      release,
      deploy_azure,
      deploy_aws,
      cleanup_ghcr
    ]

    steps:
      - name: Publish unified summary
        run: |
          echo "## Multi-Cloud Deployment Summary (Go)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Build Artifact" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release tag: \`${{ needs.release.outputs.release-tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- GHCR temp image: \`${{ needs.build_once.outputs.ghcr-image }}:${{ needs.build_once.outputs.ghcr-tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Digest: \`${{ needs.build_once.outputs.ghcr-digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Pipeline Status" >> "$GITHUB_STEP_SUMMARY"
          echo "| Stage | Azure | AWS |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|-----|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Release | ${{ needs.release.result }} | ${{ needs.release.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Promote image | ${{ needs.promote_azure.result }} | ${{ needs.promote_aws.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Deploy | ${{ needs.deploy_azure.result }} | ${{ needs.deploy_aws.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### External Access" >> "$GITHUB_STEP_SUMMARY"
          echo "| Cloud | App URL | Health URL | External Address |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|---------|------------|------------------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Azure | ${{ needs.deploy_azure.outputs.app_url || 'pending' }} | ${{ needs.deploy_azure.outputs.health_url || 'pending' }} | ${{ needs.deploy_azure.outputs.external_addr || 'pending' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AWS | ${{ needs.deploy_aws.outputs.app_url || 'pending' }} | ${{ needs.deploy_aws.outputs.health_url || 'pending' }} | ${{ needs.deploy_aws.outputs.external_addr || 'pending' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### AWS Reachability Check" >> "$GITHUB_STEP_SUMMARY"
          echo "- Status: **${{ needs.deploy_aws.outputs.external_status || 'pending' }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Detail: ${{ needs.deploy_aws.outputs.external_note || 'No detail' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### GHCR Cleanup" >> "$GITHUB_STEP_SUMMARY"
          echo "- Status: **${{ needs.cleanup_ghcr.outputs.cleanup-status }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Detail: ${{ needs.cleanup_ghcr.outputs.cleanup-note }}" >> "$GITHUB_STEP_SUMMARY"
